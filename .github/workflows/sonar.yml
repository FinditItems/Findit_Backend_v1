name: SonarCloud

on:
  push:
    branches:
      - main
      - master
      - deploy-test
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            services/core-service/package-lock.json
            services/matching-service/package-lock.json
            services/claims-service/package-lock.json
            services/notifications-service/package-lock.json

      - name: Install core-service dependencies
        run: npm ci
        working-directory: services/core-service

      - name: Install matching-service dependencies
        run: npm ci
        working-directory: services/matching-service

      - name: Install claims-service dependencies
        run: npm ci
        working-directory: services/claims-service

      - name: Install notifications-service dependencies
        run: npm ci
        working-directory: services/notifications-service

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
