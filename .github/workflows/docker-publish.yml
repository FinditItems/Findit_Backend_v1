name: Docker Publish

on:
  push:
    branches:
      - main
      - master
      - deploy-test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Build and Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: ./services/api-gateway
            image: ghcr.io/${{ github.repository_owner }}/findit-api-gateway
          - name: core-service
            context: ./services/core-service
            image: ghcr.io/${{ github.repository_owner }}/findit-core-service
          - name: matching-service
            context: ./services/matching-service
            image: ghcr.io/${{ github.repository_owner }}/findit-matching-service
          - name: claims-service
            context: ./services/claims-service
            image: ghcr.io/${{ github.repository_owner }}/findit-claims-service
          - name: notifications-service
            context: ./services/notifications-service
            image: ghcr.io/${{ github.repository_owner }}/findit-notifications-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}